name: Check external links

# Lessons point at pages we do not control. This reports the ones that have moved.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,206,403,429
            --exclude 'example\.com'
            --exclude 'github\.com/.*/new/'
            content README.md CONTRIBUTING.md
          fail: true
