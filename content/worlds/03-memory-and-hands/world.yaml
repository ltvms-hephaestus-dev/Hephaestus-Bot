title: "Knowledge and tools"
part: Memory and hands
question: "How can it know my data and do things, if it only predicts text?"
summary: >-
  A frozen model knows nothing about your documents and cannot act. This world adds
  both: retrieval puts the right knowledge in the context window, and tool calling
  lets the model ask your code to do something.
