id: autonomy
order: 5
title: "Agents"
part: Autonomy
question: "What changes when the model decides its own next step?"
summary: >-
  An agent is a model using tools in a loop until a goal is met. This world builds
  that loop, shows when a fixed workflow is the better choice, and covers what keeps a
  loop from running forever or forgetting what it was doing.
