id: nothing-is-remembered
title: Nothing is remembered
concepts:
  - stateless API
  - resending the history
  - your code owns the memory

lesson: |
  In World 1 you saw that the model has no memory, only a context window. The API
  works the same way: it is **stateless**. Each request stands alone. When the
  response has been sent, the server keeps nothing.

  So how does a chat remember what you said a minute ago? Your code does the
  remembering:

  1. Keep the conversation in a list.
  2. For every turn, add the new user message and send the **whole list**.
  3. Add the model's reply to the list, ready for the next turn.

  This has two consequences worth knowing early.

  **Cost grows with the conversation.** Turn twenty sends turns one to nineteen
  again, and you pay for those tokens again.

  **You are in control.** Because the history is just a list in your program,
  you can shorten it, summarise it, correct it or start over. The model will
  believe whatever list you send.

goal: |
  The first exchange is saved in `history`. The user now asks a new question.
  Complete the request so that the robot can answer it.

scene:
  type: messages
  needs: [sent]
  request: { model: forge-1, max_tokens: "100" }
  cases:
    - when: { sent: '^(history\s*\+\s*\[\s*question\s*\]|\[\s*\.\.\.\s*history\s*,\s*question\s*,?\s*\])$' }
      messages:
        - { role: user, content: "My name is Ada." }
        - { role: assistant, content: "Hello, Ada!" }
        - { role: user, content: "Who am I?" }
      reply: You are Ada.
    - when: { sent: '^\[?\s*question\s*\]?$' }
      messages:
        - { role: user, content: "Who am I?" }
      reply: I do not know who you are. You have not told me.
      note: One message was sent. The server kept nothing from the first request.
    - when: { sent: "^history$" }
      messages:
        - { role: user, content: "My name is Ada." }
        - { role: assistant, content: "Hello, Ada!" }
      reply: Is there something you would like to ask me, Ada?
      note: The new question never left your program.
    - when: { sent: ".+" }
      error: "messages: expected a list of messages."

challenge:
  type: fill
  code:
    python: |
      history = [
          {"role": "user", "content": "My name is Ada."},
          {"role": "assistant", "content": "Hello, Ada!"},
      ]
      question = {"role": "user", "content": "Who am I?"}

      reply = client.messages.create(
          model="forge-1",
          max_tokens=100,
          messages={{sent}},
      )
    typescript: |
      const history = [
        { role: "user", content: "My name is Ada." },
        { role: "assistant", content: "Hello, Ada!" },
      ];
      const question = { role: "user", content: "Who am I?" };

      const reply = await client.messages.create({
        model: "forge-1",
        max_tokens: 100,
        messages: {{sent}},
      });
  blanks:
    sent:
      placeholder: which messages?
      width: 24
      caseSensitive: true
      accept: { regex: 'history\s*\+\s*\[\s*question\s*\]|\[\s*\.\.\.\s*history\s*,\s*question\s*,?\s*\]' }
      feedback: Look at what was sent on the board. The robot needs the old messages and the new one.

hints:
  - Try `[question]` and read the reply. What is missing from the request?
  - You need one list containing everything in `history` followed by `question`.
  - "In Python: `history + [question]`. In TypeScript: `[...history, question]`."

success: |
  The robot knew the name only because you sent the first exchange again. Every
  chat product you have used does this on every turn.

  It also explains why long conversations get slower and more expensive, and why
  applications trim or summarise old turns. You will put numbers on that two
  levels from now.

links:
  - title: Get started with Claude
    url: https://platform.claude.com/docs/en/get-started
    kind: docs
    note: Follow it into the multi-turn section to see the list grow turn by turn.
  - title: Text generation with Gemini
    url: https://ai.google.dev/gemini-api/docs/text-generation
    kind: docs
    note: Its chat helper keeps the list for you. Underneath, it still resends everything.
  - title: Effective context engineering for AI agents
    url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
    kind: article
    note: What to keep and what to drop once the history gets long.

solution: { sent: "history + [question]" }
wrong: { sent: "[question]" }
