title: "LLMs from code"
part: Voice
question: "How do I get an answer out of a model from my own program?"
summary: >-
  A model is a web service. You send it a list of messages and get text back. This
  world covers the request, the roles in a conversation, why you resend history,
  streaming, what it costs and how to get JSON you can trust.
